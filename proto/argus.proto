syntax = "proto3";
package argus.v1;
option csharp_namespace = "Argus.Detector.V1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

message Point {
  string entity_id = 1;
  google.protobuf.DoubleValue value = 2;
  google.protobuf.Timestamp timestamp = 3;
  map<string, string> params = 4;
}

message Verdict {
  string entity_id = 1;
  google.protobuf.DoubleValue score = 2;
  google.protobuf.DoubleValue expected = 3;
  google.protobuf.DoubleValue lower = 4;
  google.protobuf.DoubleValue upper = 5;
  bool is_anomaly = 6;
  string detector = 7;
  google.protobuf.Timestamp timestamp = 8;
  bool warmed_up = 9;
  int32 n_seen = 10;
  int32 window = 11;
}

message FitRequest {
  string entity_id = 1;
  string detector = 2;
  map<string, string> params = 3;
  repeated Point window = 4;
}

message FitResponse {
  bool ok = 1;
  string error = 2;
}

message ScoreBatchRequest {
  string entity_id = 1;
  string detector = 2;
  map<string, string> params = 3;
  repeated Point window = 4;
}

message ScoreBatchResponse {
  repeated Verdict verdicts = 1;
  bool ok = 2;
  string error = 3;
}

message SaveModelRequest {
  string entity_id = 1;
  string detector = 2;
  int32 version = 3;
  bytes model_bytes = 4;
}

message SaveModelResponse {
  bool ok = 1;
  string error = 2;
}

message LoadModelRequest {
  string entity_id = 1;
  string detector = 2;
  int32 version = 3;
}

message LoadModelResponse {
  bool ok = 1;
  bytes model_bytes = 2;
  string error = 3;
}

message Series {
  string member_id = 1;
  repeated double values = 2;
}

message FeatureContribution {
  string member_id = 1;
  double contribution = 2;
}

message GroupScoreRequest {
  string group_id = 1;
  string detector = 2;          // "peer_divergence" | "ecod" | "copod" | "pca" | "iforest"
  map<string, string> params = 3;
  repeated Series series = 4;   // one Series per member; parallel value arrays, shared timestamp axis
}

message GroupScoreResponse {
  repeated Verdict per_member = 1;                 // populated for peer-divergence mode
  Verdict group_verdict = 2;                       // populated for joint-multivariate mode
  repeated FeatureContribution contributions = 3;  // ranked; empty for non-attributable detectors
  bool ok = 4;
  string error = 5;
}

message FitGroupRequest {
  string group_id = 1;
  string detector = 2;
  map<string, string> params = 3;
  repeated Series series = 4;
}

message FitGroupResponse {
  bool ok = 1;
  string error = 2;
}

message WarmupRequest {
  string entity_id = 1;
  string detector = 2;
  map<string, string> params = 3;
  repeated Point history = 4;
}

message WarmupResponse {
  bool ok = 1;
  string error = 2;
  int32 n_seen = 3;
  bool warmed_up = 4;
  bool skipped = 5;
}

// WS6 simulator (F14 sandbox): replay a stored history through a detector instance
// that is created, used and discarded inside the call. Own number space — nothing in
// Point/Verdict is renumbered, so an old detector simply answers UNIMPLEMENTED.
message SimulateRequest {
  string entity_id = 1;
  string detector = 2;
  map<string, string> params = 3;
  repeated Point history = 4;
  string request_id = 5;
}

message SimulateResponse {
  bool ok = 1;
  string error = 2;
  // packed; len == len(history), 1:1 by index
  repeated double scores = 3;
  // packed; len == len(scores), or 0 when the detector computes no robust z
  repeated double robust_z = 4;
  // effective warm-up window (hst: window, rmad: min_samples) — without it the UI
  // cannot write "not enough history ({points}/{window})"
  uint32 window = 5;
  // first scorable index; scores[i < idx] == 0.0 and MUST NOT be gated
  uint32 warmed_up_from_index = 6;
  string detector_version = 7;
}

service DetectorService {
  rpc ScoreStream(stream Point) returns (stream Verdict);
  rpc Fit(FitRequest) returns (FitResponse);
  rpc ScoreBatch(ScoreBatchRequest) returns (ScoreBatchResponse);
  rpc SaveModel(SaveModelRequest) returns (SaveModelResponse);
  rpc LoadModel(LoadModelRequest) returns (LoadModelResponse);
  rpc ScoreGroupBatch(GroupScoreRequest) returns (GroupScoreResponse);
  rpc FitGroup(FitGroupRequest) returns (FitGroupResponse);
  rpc Warmup(WarmupRequest) returns (WarmupResponse);
  rpc Simulate(SimulateRequest) returns (SimulateResponse);
}
