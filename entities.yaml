# Argus monitored entities configuration
# Q1: replace placeholder entity_ids with real HA entity_ids before integration testing
# See: .planning/STATE.md open question Q1
#
# schema_version 2 (D-L): rmad is the default single-sensor detector. Without the stamp
# EntitiesSchemaMigrator rewrites this file on every boot, and every rewrite is a rename,
# i.e. a config Swap that resets every entity's alert gate.

schema_version: 2

entities:
  - entity_id: sensor.salon_temperatura
    friendly_name: "Salon temperatura"
    detectors:
      - name: rmad
        params:
          window: "720"
          min_samples: "60"
          z_scale: "5.0"
          scale_floor: "0.0"
          high_threshold: "0.5"
          low_threshold: "0.375"
          min_consecutive: "3"
          frozen_window: "10"
          frozen_variance_threshold: "0.0"

  - entity_id: sensor.outdoor_temperature
    friendly_name: "Zewnatrz temperatura"
    detectors:
      - name: rmad
        params: {}  # use all defaults per D-A/D-B

  - entity_id: sensor.outdoor_humidity
    friendly_name: "Zewnatrz wilgotnosc"
    detectors:
      - name: rmad
        params: {}  # use all defaults per D-A/D-B
