name: Build and Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      image_ref: ${{ steps.imgref.outputs.ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run unit tests
        # Target the .sln explicitly: orchestrator/ holds both Argus.Orchestrator.sln and
        # Argus.Orchestrator.slnx, and a bare folder argument makes MSBuild bail out with
        # MSB1050 ("more than one project or solution file") — which failed every release
        # build so far. The .slnx format also needs SDK 9.0.200+, so .sln is the right target
        # for the .NET 8 SDK pinned above.
        run: dotnet test orchestrator/Argus.Orchestrator.sln -c Release --logger "console;verbosity=normal"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build SPA (CI-side verification only — Dockerfile builds it again at image build time)
        working-directory: orchestrator/ui
        run: |
          npm ci
          npm run build

      - name: Assert SPA assets present in wwwroot
        shell: bash
        run: |
          test -f orchestrator/Argus.Orchestrator/wwwroot/index.html || {
            echo "FAIL: index.html not in wwwroot"
            exit 1
          }
          ls orchestrator/Argus.Orchestrator/wwwroot/assets/*.js >/dev/null 2>&1 || {
            echo "FAIL: no assets/*.js in wwwroot"
            exit 1
          }
          echo "OK: SPA assets present in wwwroot"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute build timestamp
        id: builddate
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Compute image version
        id: ver
        env:
          REF: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            version="${REF#v}"
          else
            # Manual run from a branch: take the version the add-on declares, because
            # Supervisor pulls {image}:{config.yaml version}. A branch name would be the
            # wrong tag anyway — and an invalid image tag as soon as it contains a slash.
            version="$(grep -m1 '^version:' argus/config.yaml | sed -e 's/^version:[[:space:]]*//' -e 's/^"//' -e 's/"$//')"
          fi
          if [ -z "$version" ]; then
            echo "FAIL: could not determine image version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Image version: $version"

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: argus/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/argus:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/argus:latest
          build-args: |
            BUILD_VERSION=${{ steps.ver.outputs.version }}
            BUILD_DATE=${{ steps.builddate.outputs.date }}
            BUILD_REF=${{ github.sha }}
        timeout-minutes: 120

      - name: Export image ref
        id: imgref
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: echo "ref=ghcr.io/${OWNER}/argus:${VERSION}" >> "$GITHUB_OUTPUT"

  image-facts:
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 30
    env:
      IMG: ${{ needs.build-and-push.outputs.image_ref }}

    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gate — manifest contains amd64 and arm64
        shell: bash
        run: |
          docker buildx imagetools inspect --raw "$IMG" \
            | jq -e '(.manifests // error("not a manifest list"))
                     | map(.platform.architecture)
                     | (contains(["amd64"]) and contains(["arm64"])) or error("missing arch")'

      - name: Gate — torch-free on amd64 and arm64
        shell: bash
        run: |
          for plat in linux/amd64 linux/arm64; do
            if docker run --rm --platform "$plat" "$IMG" python3 -c "import torch" 2>/dev/null; then
              echo "FAIL: torch importable on $plat"
              exit 1
            fi
            echo "OK torch-free on $plat"
          done

      - name: Gate — compressed image size < 2 GB per arch
        shell: bash
        run: |
          # Enumerate per-arch manifest digests from the OCI index
          digests=$(docker buildx imagetools inspect --raw "$IMG" \
            | jq -r '.manifests[]
                     | select(.platform.os == "linux")
                     | select(.platform.architecture == "amd64" or .platform.architecture == "arm64")
                     | "\(.platform.architecture) \(.digest)"')

          while IFS=' ' read -r arch digest; do
            # Sum config.size + all layers[].size from the per-arch manifest
            total=$(docker buildx imagetools inspect --raw "${IMG%:*}@${digest}" \
              | jq '
                  (.config.size // 0)
                  + ([.layers[]?.size // 0] | add // 0)
                ')
            mb=$(( total / 1024 / 1024 ))
            echo "Compressed size for $arch: ${mb} MB (${total} bytes)"
            if [ "$total" -ge 2147483648 ]; then
              echo "FAIL: $arch compressed size ${mb} MB >= 2048 MB limit"
              exit 1
            fi
          done <<< "$digests"
          echo "OK all arch sizes under 2 GB"
